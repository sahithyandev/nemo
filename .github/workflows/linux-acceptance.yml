name: Linux ext4 acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ext4 fixture tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs
      - name: Verify image and native ext4 round trips
        run: python3 scripts/linux-acceptance.py --work-parent "$GITHUB_WORKSPACE" --require-live
