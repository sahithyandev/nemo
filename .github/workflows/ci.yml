name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # only cancel superseded PR runs; never cancel a main/release run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check VERSION and CHANGELOG format
        run: sh scripts/check-release-files.sh
      - name: Test release notes script
        run: sh scripts/release-notes_test.sh
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt -w . to format these files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Static analysis
        run: go vet ./...

  build:
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  tag:
    needs: [checks, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        shell: bash
        run: |
          num="$(tr -d '[:space:]' < cmd/VERSION)"
          v="v$num"
          echo "version=$v" >> "$GITHUB_OUTPUT"

          # require plain MAJOR.MINOR.PATCH (optional -prerelease)
          if ! printf '%s\n' "$num" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error title=Invalid version::cmd/VERSION '$num' is not in MAJOR.MINOR.PATCH format"
            exit 1
          fi

          # require a non-empty CHANGELOG section for this version; no section -> skip
          if ! sh scripts/release-notes.sh "$num" > /dev/null; then
            echo "::notice title=Release skipped::CHANGELOG.md has no non-empty '## $num' section (cmd/VERSION is $num), so no tag or release was created"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "$v" >/dev/null 2>&1; then
            echo "$v already released, skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag "$v"
          git push origin "$v"
          echo "created=true" >> "$GITHUB_OUTPUT"

  sbom:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Generate SBOM
        run: make sbom
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  release:
    needs: [tag, sbom]
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v8
        with:
          name: sbom-cyclonedx
      - name: Extract changelog notes
        shell: bash
        run: sh scripts/release-notes.sh > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  untag:
    needs: [tag, sbom, release]
    if: failure() && needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete tag of failed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ needs.tag.outputs.version }}"
          gh release delete "$v" --repo "$GITHUB_REPOSITORY" --yes || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$v"
